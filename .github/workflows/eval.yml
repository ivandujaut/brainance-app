name: Correr eval de respuestas

# Runs the answers eval (evals/rag-answers, spec 001) and publishes its summary for the landing and
# /como-medimos (spec 013). Launched by hand from Actions → Correr eval de respuestas → Run workflow.
# Needs the AI_GATEWAY_API_KEY secret (a Vercel AI Gateway API key). A full run costs about
# US$ 2–4, mostly the judge. The results go to a new branch, to review and merge through a PR.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelo a evaluar (id del AI Gateway)
        default: anthropic/claude-haiku-4.5
        required: true
      reps:
        description: Repeticiones por consulta (1 a 3)
        default: "2"
        required: true
      approve_harness:
        description: Aprobar el harness (la primera vez, o si cambiaron el prompt o los casos y ya lo revisaste)
        type: boolean
        default: false
      judge:
        description: Modelo juez (cambiarlo solo si el de por defecto no está disponible)
        default: anthropic/claude-opus-5.5
        required: true

# One eval at a time: two runs would race for the same results folder.
concurrency:
  group: eval-rag-answers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    name: Eval con ${{ inputs.model }}
    runs-on: ubuntu-latest
    # Up to four passes at half the concurrency, with pauses between them.
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: 1
      MODEL: ${{ inputs.model }}
      REPS: ${{ inputs.reps }}
      APPROVE: ${{ inputs.approve_harness }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Revisar las entradas
        run: |
          [[ "$MODEL" =~ ^[a-z0-9-]+/[a-z0-9.-]+$ ]] || { echo "::error::Modelo inválido: $MODEL"; exit 1; }
          [[ "$EVAL_JUDGE_MODEL" =~ ^[a-z0-9-]+/[a-z0-9.-]+$ ]] || { echo "::error::Juez inválido: $EVAL_JUDGE_MODEL"; exit 1; }
          [[ "$REPS" =~ ^[1-3]$ ]] || { echo "::error::Las repeticiones van de 1 a 3."; exit 1; }

      - name: Correr el eval
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          [ -n "$AI_GATEWAY_API_KEY" ] || { echo "::error::Falta el secret AI_GATEWAY_API_KEY (docs/lanzamiento.md)."; exit 1; }
          # Always a fresh run: committed results from an earlier one would make the runner skip every case.
          rm -rf evals/rag-answers/results/baseline
          args=(--variant baseline --model "$MODEL" --reps "$REPS" --concurrency 2)
          [ "$APPROVE" = "true" ] && args+=(--approve-harness)
          # The AI Gateway rate-limits in bursts of a minute or two, longer than the runner's own
          # backoff. A new pass resumes only the (case, rep) pairs that failed, after a pause.
          set +e
          for pass in 1 2 3 4; do
            npm run eval:rag -- "${args[@]}"
            status=$?
            [ "$status" -eq 0 ] && exit 0
            # 1 = some cases failed (worth another pass); anything else = it could not start.
            [ "$status" -ne 1 ] && { echo "::error::El eval no pudo arrancar (código $status): revisá el log."; exit "$status"; }
            echo "Pasada $pass incompleta."
            node -e '
              const fs = require("fs");
              const path = "evals/rag-answers/results/baseline/errors.jsonl";
              const rows = fs.existsSync(path) ? fs.readFileSync(path, "utf8").split("\n").filter(Boolean).map(JSON.parse) : [];
              const byClass = {};
              for (const r of rows) byClass[r.failure_class] = (byClass[r.failure_class] ?? 0) + 1;
              console.log("Errores acumulados por tipo (judge_error = el juez):", JSON.stringify(byClass));
              const last = rows.at(-1);
              if (last) console.log("Último error:", last.error);
            '
            [ "$pass" -lt 4 ] && sleep 120
          done
          echo "::error::El eval quedó incompleto después de 4 pasadas: el AI Gateway sigue rechazando llamadas. Mirá los errores por tipo en este log."
          exit 1

      # The bot's answers live in the traces, which are not committed: publish in this same job.
      - name: Publicar el resumen
        run: npm run eval:publish | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Subir los resultados a una rama
        run: |
          npm run --silent eval:summary >> "$GITHUB_STEP_SUMMARY"
          branch="eval/rag-answers-$(date -u +%F)-${GITHUB_RUN_NUMBER}"
          git config user.name "Ivan Dujaut"
          git config user.email "dujautivan@gmail.com"
          git checkout -b "$branch"
          git add evals/rag-answers/results src/content/eval/rag-answers.json
          git commit -m "chore: resultados del eval de respuestas con $MODEL"
          git push origin "$branch"
          echo "Resultados en la rama \`$branch\`: abrí un PR contra develop para publicarlos." >> "$GITHUB_STEP_SUMMARY"
