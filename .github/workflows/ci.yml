name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/sign-up
    steps:
      - name: Skip without Clerk test keys
        if: env.CLERK_SECRET_KEY == ''
        run: echo "::notice::E2E skipped — add E2E_CLERK_PUBLISHABLE_KEY and E2E_CLERK_SECRET_KEY repository secrets to enable it."
      - uses: actions/checkout@v4
        if: env.CLERK_SECRET_KEY != ''
      - uses: actions/setup-node@v4
        if: env.CLERK_SECRET_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLERK_SECRET_KEY != ''
        run: npm ci
      - if: env.CLERK_SECRET_KEY != ''
        run: npx playwright install --with-deps chromium
      - if: env.CLERK_SECRET_KEY != ''
        run: npm run build
      - if: env.CLERK_SECRET_KEY != ''
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
